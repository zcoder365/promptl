{% extends "template.html" %}
{% block content %}

<div class="congrats-card">
    <h1 class="congrats-title-text">{{ compliment }}</h1>

    <div class="congrats-story-title">
        <span class="label">Title:</span>{{ title }}
    </div>

    <div class="stat-list">
        <div class="stat-item">
            <span class="value">{{ words }}/5</span>
            <span class="label">Words used</span>
        </div>
        <div class="stat-item">
            <span class="value">{{ story_len }}</span>
            <span class="label">Words written</span>
        </div>
        <div class="stat-item">
            <span class="value">{{ points }}</span>
            <span class="label">Points earned</span>
        </div>
    </div>

    <a href="/home" class="cta-button">Write another story</a>
</div>

{% endblock %}
